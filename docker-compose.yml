services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: herba-scan-dashboard-app
        container_name: herba-scan-dashboard-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - herba-scan-network
        ports:
            - "9000:9000"
        depends_on:
            - db

    db:
        image: mysql:8.0
        container_name: herba-scan-dashboard-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - herba-scan-network

networks:
    herba-scan-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
