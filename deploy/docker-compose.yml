services:
    app:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
        container_name: herba-scan-dashboard-app
        restart: unless-stopped
        env_file:
            - ../.env
        volumes:
            - appdata:/var/www/html/storage
        networks:
            - proxy
        ports:
            - "9000:80"
        depends_on:
            - db

    db:
        image: mysql:8.0
        container_name: herba-scan-dashboard-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: herba_scan_dashboard
            MYSQL_ROOT_PASSWORD: root
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - proxy

networks:
    proxy:
        external: true

volumes:
    dbdata:
        driver: local
    appdata:
        driver: local
