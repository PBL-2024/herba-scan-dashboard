<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Increase limits for large headers and request size
    LimitRequestFieldSize 32768
    LimitRequestLine 32768
    LimitRequestFields 200

    # Trust proxy headers from Nginx Proxy Manager
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16
    RemoteIPInternalProxy 10.0.0.0/8

    # Set HTTPS environment variable when X-Forwarded-Proto is https
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    
    # Pass proxy headers to PHP
    SetEnvIf X-Forwarded-Proto "^https$" HTTP_X_FORWARDED_PROTO=https
    SetEnvIf X-Forwarded-Host "^(.+)$" HTTP_X_FORWARDED_HOST=$1
    SetEnvIf X-Forwarded-Port "^(.+)$" HTTP_X_FORWARDED_PORT=$1

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>